# kind cluster definition for the playground.
#
# NOTE: extraPortMappings can only be set at cluster-creation time. Adding a
# port later requires recreating the cluster (`make recreate`). The NodePort
# range below is pre-wired so you can expose Services without a rebuild:
#   30000 -> localhost:30000   (generic / gRPC experiments)
#   30001 -> localhost:30001
#   30002 -> localhost:30002
# Ports 80 and 443 are mapped for ingress controllers.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: playground
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
      - containerPort: 30002
        hostPort: 30002
        protocol: TCP
  - role: worker
  - role: worker
